name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # The rpi pool is native arm64 — the architecture this actually runs on —
    # and it already has devbox, so there is nothing to bootstrap.
    runs-on: [self-hosted, rpi]
    steps:
      # Full history: `task secrets` scans commits as well as the working
      # tree, and the default shallow fetch would leave it one commit to look
      # at. This repository is small enough that the clone costs nothing.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan, lint, test, build
        run: devbox run -- task ci

  image:
    needs: ci
    if: github.event_name == 'push'
    # Builds the image ON the host that runs it and tags it locally. No
    # registry: ghcr is off for now, so the image never leaves this machine —
    # the same arrangement media-puller uses on this Pi. Compose references
    # bambu-timelapse:latest with pull_policy:never.
    runs-on: [self-hosted, rpi]
    steps:
      - uses: actions/checkout@v5

      - name: Build the local image
        run: docker build -t bambu-timelapse:latest .

      # Watchtower on the Pi watches for local image changes and recreates the
      # container, so a rebuilt tag is all a deploy needs. Guarded so a first
      # run, before the service is ever deployed, is not a failure.
      - name: Report
        run: |
          docker image inspect bambu-timelapse:latest \
            --format 'built {{.Id}} ({{.Size}} bytes)'
          docker ps --filter name=bambu-timelapse --format '{{.Names}} {{.Status}}' || true

  release:
    needs: ci
    if: github.ref_type == 'tag'
    runs-on: [self-hosted, rpi]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Build release archives
        run: devbox run -- task dist VERSION=${GITHUB_REF_NAME#v}

      # Binaries only while ghcr is disabled; the versioned image tag comes
      # back with the registry.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            build/dist/*.tar.gz build/dist/SHA256SUMS
