name: Build and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # The rpi pool is native arm64 — the architecture this actually runs on —
    # and it already has devbox, so there is nothing to bootstrap.
    runs-on: [self-hosted, rpi]
    steps:
      - uses: actions/checkout@v5
      - name: Lint, test, build
        run: devbox run -- task ci

  publish:
    needs: ci
    if: github.event_name == 'push'
    runs-on: [self-hosted, rpi]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest tracks main for Watchtower. A tagged build additionally
      # publishes its version, which is what a rollback pins to — the commit
      # SHA is already recorded in the image's own labels, so tagging by it
      # would just be a second name for the same thing.
      - id: tags
        run: |
          tags="ghcr.io/openserbia/bambu-timelapse:latest"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags="${tags}
          ghcr.io/openserbia/bambu-timelapse:${GITHUB_REF_NAME#v}"
          fi
          {
            echo "list<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: [self-hosted, rpi]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Build release archives
        run: devbox run -- task dist VERSION=${GITHUB_REF_NAME#v}

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            build/dist/*.tar.gz build/dist/SHA256SUMS
