version: 2
project_name: bambu-timelapse

# Under build/, which is already gitignored, rather than a second ignored
# directory at the root.
dist: build/dist

builds:
  - id: bambu-timelapse
    main: ./cmd/bambu-timelapse
    binary: bambu-timelapse
    env:
      - CGO_ENABLED=0
    # netgo/osusergo keep DNS and user lookups in Go rather than glibc's NSS,
    # which is what makes the binary run on the Alpine runtime image as well
    # as on a distro host. Same flags task build uses.
    flags:
      - -trimpath
      - -tags=netgo,osusergo
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .CommitDate }}
    # Linux is what the service deploys to. darwin and windows are for the
    # laptop-side subcommands, `record` and `debug`, which need a printer on
    # the LAN and an ffmpeg on PATH but no container.
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # CommitDate rather than the build clock: two builds of one tag then
    # produce identical binaries.
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - formats: [tar.gz]
    # zip on Windows: tar.gz needs a third-party tool there, and Explorer
    # opens a zip on its own.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - README.md

checksum:
  # The name the previous hand-rolled release used, kept so a download script
  # written against it still works.
  name_template: SHA256SUMS

changelog:
  use: github
  sort: asc
  # Short shas: the full 40 characters in a bullet list is noise nobody reads.
  abbrev: 7
  # Grouped by conventional-commit type, so a release says what kind of change
  # it is before you read a single subject line.
  groups:
    - title: Features
      regexp: '(^|: )feat(\(.+\))?:'
      order: 0
    - title: Fixes
      regexp: '(^|: )fix(\(.+\))?:'
      order: 1
    - title: Performance
      regexp: '(^|: )perf(\(.+\))?:'
      order: 2
    - title: Build and CI
      regexp: '(^|: )(build|ci)(\(.+\))?:'
      order: 3
    - title: Other
      order: 99
  filters:
    # Anchored on the subject or on the "<sha>: " goreleaser prefixes it with,
    # and tolerant of a conventional-commit scope: '^docs:' alone matched
    # neither "chore(deps): ..." nor the rendered line, so v1.0.0's notes
    # carried every chore commit in the repository.
    exclude:
      - '(^|: )docs(\(.+\))?:'
      - '(^|: )chore(\(.+\))?:'
      - '(^|: )test(\(.+\))?:'

release:
  # A tag like v1.0.0-rc.1 publishes as a prerelease without a second config.
  prerelease: auto
  header: |
    Layer-synced timelapses of Bambu Lab prints, captured from the printer's
    own chamber camera and posted to a media endpoint when the print finishes.
    No cloud service and none of the printer's storage: telemetry comes off
    local MQTT, frames off RTSPS, both authenticated with the LAN access code.
  footer: |
    ## Install

    Archives are attached for linux, macOS and Windows on amd64 and arm64,
    with a `SHA256SUMS`. ffmpeg is expected on PATH, or pointed at with
    `FFMPEG_BIN`.

    ```sh
    tar -xzf {{ .ProjectName }}_{{ .Version }}_linux_arm64.tar.gz
    ./{{ .ProjectName }} version
    ```

    The container image ships ffmpeg already, and is `linux/arm64` only
    because CI builds it natively on the Pi that runs it. On amd64, use the
    archive.

    ```sh
    docker pull ghcr.io/openserbia/{{ .ProjectName }}:{{ .Version }}
    ```

    The daemon deploys to Linux; the macOS and Windows binaries are for
    `record` and `debug`, which need a printer on the LAN and an ffmpeg on
    PATH but no container.

    `PRINTER_HOST`, `PRINTER_SERIAL` and `PRINTER_ACCESS_CODE` are the
    required configuration, plus `MEDIA_API_URL` and `MEDIA_API_TOKEN` when
    the service posts rather than records locally. The README covers the rest,
    including what the upload endpoint has to accept.
