version: '3'

vars:
  BUILD_PATH: build

tasks:
  deps:
    desc: Download modules and audit reachable CVEs
    sources:
      - go.mod
      - go.sum
      # devbox.lock too: govulncheck's verdict depends on the Go TOOLCHAIN as
      # much as on the modules, and most advisories it reports are stdlib. Without
      # this, a toolchain bump leaves a stale "up to date" cache and the scan
      # never re-runs. (tg-antispam learned this the hard way: a red CI sat
      # unexplained because `deps` kept reporting itself cached.)
      - devbox.lock
    cmds:
      - go mod download
      - go mod tidy
      - govulncheck ./...

  fmt:
    desc: Format
    cmds:
      - gci write -s standard -s default -s "prefix(github.com/openserbia)" --skip-generated .
      - gofumpt -l -w .

  lint:
    desc: Format then lint
    deps: [deps]
    cmds:
      - task: fmt
      - golangci-lint run

  hooks:
    desc: Install the git hooks in .githooks
    # core.hooksPath rather than copying into .git/hooks: the hook stays a
    # tracked file, so changing it is a reviewable diff and nobody ends up
    # running a stale copy. It is per-clone config, so this runs once after
    # cloning.
    cmds:
      - git config core.hooksPath .githooks
      - echo "hooks installed; skip one commit with git commit --no-verify"

  secrets:
    desc: Scan the working tree and history for committed credentials
    # Two passes, because they answer different questions: `dir` catches a
    # secret that is about to be committed, `git` catches one that already
    # was and was later deleted: removing the line does not remove the blob.
    # Not cached on sources: the second pass depends on history, which changes
    # without any tracked file changing.
    #
    # .gitleaks.toml allowlists .env and the build/cache trees; everything
    # else, including untracked files, is scanned.
    cmds:
      - gitleaks dir . --redact --no-banner
      - gitleaks git --redact --no-banner

  test:
    desc: Unit tests
    cmds:
      - go test ./...

  build:
    desc: Build the static binary
    deps: [deps]
    cmds:
      # Static: the runtime image is Alpine (musl), and netgo/osusergo keep DNS
      # and user lookups in Go rather than glibc's NSS.
      - CGO_ENABLED=0 go build -tags "netgo osusergo" -trimpath -ldflags="-s -w" -o {{.BUILD_PATH}}/bambu-timelapse ./cmd/bambu-timelapse

  dist:
    desc: Cross-build release archives + checksums into build/dist
    deps: [deps]
    vars:
      VERSION: '{{.VERSION | default "dev"}}'
    cmds:
      - rm -rf {{.BUILD_PATH}}/dist && mkdir -p {{.BUILD_PATH}}/dist
      # Both architectures from one runner: the binary is pure Go with CGO off,
      # so cross-compiling costs nothing and needs no emulation.
      - for arch in amd64 arm64; do
          CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -tags "netgo osusergo" -trimpath
            -ldflags="-s -w" -o {{.BUILD_PATH}}/dist/bambu-timelapse ./cmd/bambu-timelapse;
          tar -czf {{.BUILD_PATH}}/dist/bambu-timelapse_{{.VERSION}}_linux_$arch.tar.gz
            -C {{.BUILD_PATH}}/dist bambu-timelapse;
          rm {{.BUILD_PATH}}/dist/bambu-timelapse;
        done
      - cd {{.BUILD_PATH}}/dist && sha256sum *.tar.gz > SHA256SUMS

  debug:
    desc: One diagnostic snapshot from the printer (task debug -- -raw)
    # Reads .env like every other local run, so it needs no arguments to find
    # the printer. Pass the command's own flags after --, e.g. -raw or
    # -frame /tmp/f.jpg.
    cmds:
      - go run ./cmd/bambu-timelapse debug {{.CLI_ARGS}}

  record:
    desc: Capture locally instead of posting (task record -- -interval 2s -frames 8)
    # Writes into build/, which is already gitignored, so a test recording
    # never turns up in a commit. Everything else is the command's own flags:
    # -interval for a timed capture that needs no print, -once to stop after
    # the first one.
    cmds:
      - mkdir -p {{.BUILD_PATH}}/recordings
      - go run ./cmd/bambu-timelapse record
          -out {{.BUILD_PATH}}/recordings
          -staging {{.BUILD_PATH}}/recordings/staging {{.CLI_ARGS}}

  ci:
    desc: What CI runs
    cmds:
      - task: secrets
      - task: lint
      - task: test
      - task: build
